name: Verify default RAM budget

on:
  push:
    branches: [feat/use-less-ram-default]

permissions:
  contents: read

concurrency:
  group: default-ram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm ci --prefix test/tooling
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-14 fonts-noto-cjk
          npm --prefix test/tooling run install:chrome
          sudo "$(command -v node)" test/run.mjs install-chrome --install-deps
      - name: Capture the detected OPFS memory controls and verify both toggle states
        run: |
          export HACHIDORI_CHROME="$(node -e "const {Browser,computeExecutablePath}=require('./test/tooling/node_modules/@puppeteer/browsers');console.log(computeExecutablePath({cacheDir:'test/tmp/browsers',browser:Browser.CHROME,buildId:require('./test/tooling/package.json').config.chrome}))")"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          const require = createRequire(resolve('test/tooling/package.json'));
          const puppeteer = require('puppeteer-core');
          const extension = resolve('extension');
          const output = resolve('test/tmp/default-ram-ui');
          mkdirSync(output, { recursive: true });
          const browser = await puppeteer.launch({ executablePath: process.env.HACHIDORI_CHROME,
            headless: true, enableExtensions: true, defaultViewport: { width: 1280, height: 1100 },
            args: [`--disable-extensions-except=${extension}`, `--load-extension=${extension}`, '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'] });
          try {
            const target = await browser.waitForTarget(t => t.type() === 'service_worker' && t.url().startsWith('chrome-extension://'));
            const id = new URL(target.url()).host;
            const page = await browser.newPage();
            for (const open of await browser.pages()) if (open !== page) await open.close();
            await page.goto(`chrome-extension://${id}/settings.html#advanced`);
            const wait = value => page.waitForFunction(async value => {
              const status = await chrome.runtime.sendMessage({ target: 'hoshidicts-offscreen', type: 'hd_status' });
              return status?.ok && status.ready && !status.loading && status.lowMemory === false
                && status.useLessRamByDefault === value ? status : false;
            }, { timeout: 30000, polling: 250 }, value).then(h => h.jsonValue());
            const initial = await wait(true);
            assert.equal(initial.residentHashBudgetBytes, 65 * 1024 * 1024);
            await page.waitForFunction(() => !document.getElementById('use-less-ram-by-default').hidden
              && document.getElementById('opt-use-less-ram-by-default').checked
              && !document.getElementById('opt-use-less-ram-by-default').disabled
              && document.getElementById('memory-indexes').textContent.includes('65.0'));
            await page.bringToFront();
            for (const palette of ['light', 'dark']) {
              await page.evaluate(palette => { document.documentElement.dataset.hoshidictsTheme = palette; }, palette);
              await page.evaluate(() => new Promise(done => requestAnimationFrame(() => requestAnimationFrame(done))));
              await (await page.$('#memory-settings')).screenshot({ path: resolve(output, `memory-${palette}.png`) });
            }
            await page.evaluate(() => document.getElementById('opt-use-less-ram-by-default').click());
            const off = await wait(false);
            assert.equal(off.hashIndexStorage, 'resident');
            assert.equal(off.residentHashBudgetBytes, null);
            await page.evaluate(() => document.getElementById('opt-use-less-ram-by-default').click());
            const on = await wait(true);
            assert.equal(on.residentHashBudgetBytes, 65 * 1024 * 1024);
            writeFileSync(resolve(output, 'states.json'), JSON.stringify({ initial, off, on }, null, 2));
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: default-ram-ui
          path: test/tmp/default-ram-ui/
          retention-days: 7

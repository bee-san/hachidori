name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to package without publishing
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hachidori-store-sources
          key: release-sources-${{ hashFiles('scripts/store-sources.json') }}
      - name: Validate version, browser support, and release tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-release.mjs
          fi
      - name: Build and verify the release pair
        run: |
          output="$RUNNER_TEMP/hachidori-release"
          python3 scripts/package-store.py --output-dir "$output"
          cd "$output"
          sha256sum -c ./*-SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hachidori-release-${{ github.run_id }}
          path: ${{ runner.temp }}/hachidori-release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/hachidori-release"
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Hachidori ${GITHUB_REF_NAME#v}"

name: Release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to package
        required: true
        default: main
      publish:
        description: Upload assets to the matching release and submit to Chrome Web Store
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hachidori-store-sources
          key: release-sources-${{ hashFiles('scripts/store-sources.json') }}
      - name: Validate version, browser support, and release tag
        id: release
        env:
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          release_commit="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
            release_tag="$GITHUB_REF_NAME"
            event_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
            if [[ "$release_commit" != "$event_commit" ]]; then
              echo "The checked-out release commit does not match the tag event." >&2
              exit 1
            fi
          elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
            node scripts/check-release.mjs
            release_tag="$(node -p "require('./extension/manifest.json').version")"
          else
            node scripts/check-release.mjs
            release_tag=""
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$MANUAL_PUBLISH" == "true" ]]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$release_commit" origin/main; then
              echo "Published releases must point to a commit on main." >&2
              exit 1
            fi
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Build and verify the release set
        run: |
          output="$RUNNER_TEMP/hachidori-release"
          python3 scripts/package-store.py --output-dir "$output"
          cd "$output"
          sha256sum -c ./*-SHA256SUMS.txt
          node "$GITHUB_WORKSPACE/scripts/verify-firefox-package.mjs" ./*-firefox-unsigned.xpi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hachidori-release-${{ github.run_id }}
          path: ${{ runner.temp }}/hachidori-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release assets
    if: github.event_name == 'push' || inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.release_commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hachidori-release-${{ github.run_id }}
          path: ${{ runner.temp }}/hachidori-release/
      - name: Publish the verified package set
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.release_commit }}
        run: |
          cd "$RUNNER_TEMP/hachidori-release"
          if [[ "$MANUAL_PUBLISH" == "true" ]]; then
            git -C "$GITHUB_WORKSPACE" fetch --force --no-tags \
              origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse "$RELEASE_TAG^{commit}")"
            if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Release tag $RELEASE_TAG points to $tag_commit, expected $RELEASE_COMMIT." >&2
              exit 1
            fi
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release upload "$RELEASE_TAG" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" ./* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes-file "$GITHUB_WORKSPACE/.github/release-notes-header.md" \
              --title "Hachidori ${RELEASE_TAG}"
          fi

  chrome-web-store:
    name: Submit Chrome Web Store update
    if: github.event_name == 'push' || inputs.publish
    needs: [package, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
      CHROME_WEBSTORE_EXTENSION_ID: ${{ vars.CHROME_WEBSTORE_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hachidori-release-${{ github.run_id }}
          path: ${{ runner.temp }}/hachidori-release/
      - name: Upload package and submit it for review
        env:
          CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_WEBSTORE_SERVICE_ACCOUNT_JSON }}
        run: |
          packages=( "$RUNNER_TEMP"/hachidori-release/*-chrome.zip )
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected exactly one verified Chrome package." >&2
            exit 1
          fi
          version="$(node -p "require('./extension/manifest.json').version")"
          node scripts/chrome-web-store.mjs \
            --package "${packages[0]}" \
            --publisher-id "$CHROME_WEBSTORE_PUBLISHER_ID" \
            --item-id "$CHROME_WEBSTORE_EXTENSION_ID" \
            --expected-version "$version" \
            --publish-type DEFAULT_PUBLISH

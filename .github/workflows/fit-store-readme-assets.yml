name: Validate store artwork

on:
  pull_request:
    paths:
      - scripts/fit-store-readme-assets.py
      - docs/store/readme/**
      - .github/workflows/fit-store-readme-assets.yml

permissions:
  contents: read

jobs:
  artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install image validator
        run: python3 -m pip install Pillow==11.3.0
      - name: Validate committed artwork and diff
        run: |
          python3 -m py_compile scripts/fit-store-readme-assets.py
          python3 scripts/fit-store-readme-assets.py --check-only
          git diff --check HEAD^1 HEAD

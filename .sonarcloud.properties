sonar.sources=extension,wasm
sonar.tests=test
sonar.exclusions=extension/vendor/**
sonar.sourceEncoding=UTF-8

# These callbacks implement worker contracts, not Window message handlers or
# arbitrary application predicates. Keep every other rule enabled in the files.
sonar.issue.ignore.multicriteria=dedicatedEncoderOrigin,audioProcessorLifetime
# DedicatedWorkerGlobalScope receives messages only from its owning Worker;
# MessageEvent.origin is not a Window postMessage origin boundary here.
sonar.issue.ignore.multicriteria.dedicatedEncoderOrigin.ruleKey=javascript:S2819
sonar.issue.ignore.multicriteria.dedicatedEncoderOrigin.resourceKey=extension/capture-encoder-worker.js
# AudioWorkletProcessor.process must return true during empty input quanta too,
# otherwise Chrome can permanently retire a processor needed for later input.
sonar.issue.ignore.multicriteria.audioProcessorLifetime.ruleKey=javascript:S3516
sonar.issue.ignore.multicriteria.audioProcessorLifetime.resourceKey=extension/capture-audio-worklet.js

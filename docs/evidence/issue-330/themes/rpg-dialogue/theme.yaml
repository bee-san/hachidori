# themes/rpg-dialogue/theme.yaml — Hachidori theme manifest, schema 1
schema: 1
slug: rpg-dialogue
name: RPG Dialogue
version: 1.0.0
author: Hachidori contributors
link: https://github.com/bee-san/hachidori/issues/334
description: A 16-bit RPG message window. The headword sits in a speaker plate, the reading and pitch accent become a segmented HP bar, each sense is typed out as a page you advance with Space, click or the blinking cursor, and a command window (おぼえる・きく・メモ・つぎ) drives the reader's own buttons.
tags: [dark, vn, spacious, js]
license: GPL-3.0-or-later
minHachidoriVersion: 0.1.7
mode: dark
extends: default
palette:                    # classic blue message window with gold / cyan / green accents
  color-scheme: dark
  base-100: "#141c8c"       # window body (mid gradient stop)
  base-200: "#0b1160"       # window bottom
  base-300: "#2434c4"       # window top
  base-content: "#f8f8ff"   # message text
  primary: "#ffe066"        # speaker name, labels (gold)
  primary-content: "#1a1030"
  secondary: "#8ae6ff"      # reading (cyan)
  secondary-content: "#06082e"
  accent: "#7cf59a"         # pitch HP bar (green)
  accent-content: "#06082e"
  neutral: "#2a3494"
  neutral-content: "#f8f8ff"
  info: "#6f9dff"
  info-content: "#06082e"
  success: "#7cf59a"
  warning: "#ffb347"
  error: "#ff7b8e"
css: theme.css
js:                         # bundled-only: shipped inside the Hachidori release, never fetched at runtime
  file: theme.js
  hooks: [onRender, onDeactivate]
  summary: Pages through senses one at a time with a typewriter effect; builds the speaker plate, pitch HP bar, page cursor and a command window that forwards to the reader's Anki, audio, Note and Back buttons.
options:                    # one-shot suggestions applied on activation, with Undo
  popupOpacityPercent: 100
  popupColumns: 1
  popupToolbarPosition: top
screenshot: screenshot.png
preview:
  swatches: ["#141c8c", "#f8f8ff", "#ffe066", "#8ae6ff", "#7cf59a"]

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mokuro-style page — manga-vertical theme evidence (issue #334)</title>
<style>
  /* A synthetic manga page in the shape mokuro produces: a page container with
   * absolutely positioned .textBox elements in writing-mode: vertical-rl over
   * the speech bubbles. The art is drawn here (panels, bubbles, speed lines,
   * screentone) so nothing copyrighted is committed; the lettering is Noto Sans
   * CJK JP because that is the only Japanese font on the capture machine. */
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #b9b3a8; font-family: "Noto Sans CJK JP", sans-serif;
  }
  body.night { background: #0d0e11; }
  #pagesContainer { position: relative; }
  .page { position: relative; width: 620px; height: 880px; background: #fbf8f1; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
  .night .page { background: #1b1d22; box-shadow: 0 6px 30px rgba(0,0,0,.8); }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ink { stroke: #141414; }
  .fill { fill: #fbf8f1; }
  .night .ink { stroke: #d8d3c8; }
  .night .fill { fill: #1b1d22; }
  .night .solid { fill: #d8d3c8; }
  .solid { fill: #141414; }
  .textBox {
    position: absolute; z-index: 2;
    writing-mode: vertical-rl; text-orientation: mixed;
    font-weight: 700; letter-spacing: 0.08em; line-height: 1.35;
    color: #141414; white-space: nowrap;
  }
  .night .textBox { color: #e6e2d8; }
  .textBox p { margin: 0; }
  #box1 { left: 392px; top: 68px;  font-size: 23px; }
  #box2 { left: 164px; top: 150px; font-size: 21px; }
  #box3 { left: 380px; top: 486px; font-size: 22px; }
  #box4 { left: 62px;  top: 610px; font-size: 20px; }
  #narration { left: 34px; top: 40px; font-size: 15px; letter-spacing: .2em; padding: 6px 4px; background: #fbf8f1; border: 2px solid #141414; }
  .night #narration { background: #1b1d22; border-color: #d8d3c8; }
</style>
</head>
<body>
<div id="pagesContainer">
  <div id="page0" class="page">
    <svg viewBox="0 0 620 880" aria-hidden="true">
      <defs>
        <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse">
          <circle cx="2.5" cy="2.5" r="1.1" class="solid" opacity=".55"/>
        </pattern>
        <pattern id="tone2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
          <circle cx="3.5" cy="3.5" r="1.5" class="solid" opacity=".35"/>
        </pattern>
      </defs>
      <!-- panel 1 -->
      <rect x="18" y="18" width="584" height="416" class="ink fill" stroke-width="3"/>
      <rect x="20" y="20" width="580" height="412" fill="url(#tone)" opacity=".28"/>
      <!-- speed lines from the top left -->
      <g class="ink" stroke-width="1.4" opacity=".7">
        <line x1="22" y1="22" x2="260" y2="300"/><line x1="60" y1="22" x2="280" y2="300"/><line x1="100" y1="22" x2="300" y2="300"/>
        <line x1="140" y1="22" x2="320" y2="300"/><line x1="22" y1="70" x2="250" y2="320"/><line x1="22" y1="120" x2="240" y2="340"/>
        <line x1="22" y1="170" x2="230" y2="360"/><line x1="22" y1="230" x2="220" y2="380"/>
      </g>
      <!-- character silhouette (head + shoulders) -->
      <ellipse cx="300" cy="300" rx="62" ry="70" class="ink fill" stroke-width="3"/>
      <path d="M180 432 C 200 360, 400 360, 420 432 Z" class="ink fill" stroke-width="3"/>
      <path d="M180 432 C 200 360, 400 360, 420 432 Z" fill="url(#tone2)"/>
      <!-- bubble A (top right) with a tail towards the head -->
      <path d="M 462 40 C 540 40, 585 60, 585 140 L 585 330 C 585 400, 540 420, 462 420 C 385 420, 355 400, 355 330 L 355 250 L 330 262 L 355 226 L 355 140 C 355 60, 385 40, 462 40 Z" class="ink fill" stroke-width="3"/>
      <!-- bubble B (left) -->
      <path d="M 214 120 C 290 120, 320 140, 320 200 L 320 340 C 320 400, 290 420, 214 420 C 140 420, 108 400, 108 340 L 108 200 C 108 140, 140 120, 214 120 Z" class="ink fill" stroke-width="3"/>
      <!-- panel 2 -->
      <rect x="18" y="452" width="584" height="410" class="ink fill" stroke-width="3"/>
      <rect x="20" y="454" width="580" height="406" fill="url(#tone2)" opacity=".22"/>
      <g class="ink" stroke-width="1.2" opacity=".6">
        <line x1="600" y1="860" x2="380" y2="640"/><line x1="560" y1="860" x2="360" y2="650"/><line x1="600" y1="820" x2="400" y2="630"/>
        <line x1="600" y1="770" x2="410" y2="620"/><line x1="600" y1="720" x2="420" y2="610"/>
      </g>
      <ellipse cx="270" cy="640" rx="70" ry="80" class="ink fill" stroke-width="3"/>
      <path d="M 140 862 C 160 760, 380 760, 400 862 Z" class="ink fill" stroke-width="3"/>
      <path d="M 140 862 C 160 760, 380 760, 400 862 Z" fill="url(#tone)" opacity=".7"/>
      <!-- bubble C (right, spiky: shouting) -->
      <path d="M 440 466 L 470 486 L 505 462 L 520 496 L 560 484 L 555 520 L 592 532 L 566 560 L 592 596 L 560 606 L 572 650 L 536 648 L 540 690 L 505 676 L 494 716 L 465 690 L 440 722 L 424 686 L 386 700 L 392 660 L 356 652 L 380 620 L 352 588 L 384 566 L 366 530 L 402 524 L 400 486 Z" class="ink fill" stroke-width="3"/>
      <!-- bubble D (bottom left) -->
      <path d="M 105 590 C 165 590, 190 606, 190 660 L 190 800 C 190 850, 165 862, 105 862 C 46 862, 22 850, 22 800 L 22 660 C 22 606, 46 590, 105 590 Z" class="ink fill" stroke-width="3"/>
    </svg>
    <div class="textBox" id="narration"><p>その頃、街では――</p></div>
    <div class="textBox" id="box1"><p>朝ごはんを</p><p>食べたかった…</p></div>
    <div class="textBox" id="box2"><p>あいつに</p><p>声を掛けてみるか</p></div>
    <div class="textBox" id="box3"><p>逃げるなんて</p><p>笑わせるな！</p></div>
    <div class="textBox" id="box4"><p>もう一度</p><p>読んでみよう</p></div>
  </div>
</div>
</body>
</html>

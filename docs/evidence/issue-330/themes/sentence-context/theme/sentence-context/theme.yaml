# themes/sentence-context/theme.yaml — Hachidori theme manifest, schema 1
schema: 1
slug: sentence-context
name: Sentence Context (文脈)
version: 1.0.0
author: bee-san
link: https://github.com/bee-san/hachidori/issues/334
description: >-
  Newspaper reader mode that keeps the sentence you were reading. The top band is
  the sentence the word came from with the word marked by sesame dots, then the
  deconjugation trail (食べたかった › -た › -たい › 食べる) as chips you can tap
  for the grammar note, then a sentence-tools row (copy, Anki, audio, mark
  words). Under a double rule: the headword, and a tight serif gloss block.
  Every word of the sentence is itself hoverable inside the popup.
tags: [light, reader, serif, sentence, js]
license: GPL-3.0-or-later
minHachidoriVersion: 0.1.7
mode: light
extends: default
palette:                     # warm newsprint, ink, vermilion (朱) for the word
  color-scheme: light
  base-100: "#f7f2e8"        # paper
  base-200: "#efe8da"        # masthead band
  base-300: "#e3dac8"        # rules, raised surfaces
  base-content: "#1f1b17"    # ink
  primary: "#a8321f"         # vermilion: match dots, chips, selected tab
  primary-content: "#fbf7f0"
  secondary: "#3b5d4f"       # expression tags
  secondary-content: "#f7f2e8"
  accent: "#6d5a3f"          # part-of-speech / pitch tags
  accent-content: "#f7f2e8"
  neutral: "#5a544b"         # generic tags
  neutral-content: "#f7f2e8"
  info: "#3f5a78"            # frequency tags
  info-content: "#f7f2e8"
  success: "#2f6b45"
  warning: "#8a5a12"
  error: "#9b2c1e"
css: theme.css
js:                          # bundled-only: shipped inside the Hachidori release, never fetched at runtime
  file: theme.js
  hooks: [onRender]
  summary: >-
    Adds a sentence masthead (the source sentence with the looked-up word marked),
    a deconjugation chip trail, and a sentence-tools row (copy sentence, mark
    words) beside the existing Anki, audio and note buttons; moves those buttons
    and the frequency/grammar capsule next to the headword. Kanji view shows the
    same sentence with the kanji emphasised and a word › lemma › kanji trail.
options:                     # one-shot suggestions applied on activation, with Undo
  popupOpacityPercent: 100
  popupToolbarPosition: top
  popupColumns: 1
screenshot: screenshot.png
preview:
  swatches: ["#f7f2e8", "#1f1b17", "#a8321f", "#3b5d4f"]

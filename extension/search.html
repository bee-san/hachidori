<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hachidori Search</title>
    <!-- The saved theme's background, painted as Settings paints it (#296),
         shows until the frame below has its own theme. settings.css takes
         its palette from render/reader.css. -->
    <script src="reader-options.js"></script>
    <script src="settings-theme.js"></script>
    <link rel="stylesheet" href="render/reader.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="search.css" />
  </head>
  <!-- search-shell.js adds the search page itself, the sandboxed
       search-frame.html (#644), over the whole window. The Clipboard monitor
       switch (#639) lies over the end of its header: Firefox asks for a
       permission only from the document whose control the user clicked. -->
  <body class="search-shell">
    <!-- The frame's icon and title stay invisible here, so the switch lands at
         the end of the frame's header at any width. -->
    <div class="search-header search-shell-header" hidden>
      <img src="icons/hachidori-48.png" width="24" height="24" alt="" aria-hidden="true" />
      <h1 aria-hidden="true">Hachidori Search</h1>
      <label class="lookup-enable" title="Search Japanese text as soon as you copy it, in any tab or program">
        <span>Clipboard monitor</span>
        <input type="checkbox" id="search-clipboard" disabled />
      </label>
    </div>
    <script type="module" src="search-shell.js"></script>
  </body>
</html>
